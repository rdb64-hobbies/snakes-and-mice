# Custom OpenAI-compatible endpoints ONLY (e.g. ollama, vLLM). The built-in
# providers — anthropic, openai, gemini, openrouter — are supported directly and
# must NOT be listed here. Copy this file to providers.yaml (git-ignored) and
# edit it; it is optional and only needed if players.yaml references a custom
# provider. Each entry is:
#   name:        the provider name referenced from players.yaml
#   base_url:    the endpoint's OpenAI-compatible base URL
#   api_key_env: (optional) the environment variable holding its key; omit for a
#                local endpoint that needs no key
#   output_mode: (optional) how the endpoint is asked for the structured move —
#                "tool" (the default) uses an output tool; "native" uses the
#                model's own JSON-schema response format. Use "native" when the
#                server has no tool-call parser for the model it serves: a parser
#                borrowed from another model family constrains generation to a
#                format the model never emits, and it then never stops. Diagnose
#                with tools/probe_tool_termination.py.
providers:
  - name: my-ollama
    base_url: http://localhost:11434/v1
    # no api_key_env — a local ollama endpoint needs no key

  - name: my-vllm
    base_url: http://gpu-box:8000/v1
    api_key_env: VLLM_API_KEY

  # The same endpoint asked for native output instead.
  - name: my-vllm-native
    base_url: http://gpu-box:8000/v1
    api_key_env: VLLM_API_KEY
    output_mode: native
