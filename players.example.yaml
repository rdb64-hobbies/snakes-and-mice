# Roster of available LLM players. Copy this file to players.yaml (git-ignored)
# and edit it. Each entry is:
#   name:     free-form identity used in matches and standings (independent of
#             the model — in common use it will just echo the model name)
#   provider: anthropic | openai | gemini | openrouter | a custom provider name
#             defined in providers.yaml
#   model:    the provider's model name
#   thinking: OPTIONAL reasoning effort — minimal | low | medium | high | xhigh.
#             Omit it to run at the shared default (high). Levels are not
#             comparable across model families, so the same word can mean a
#             different relative effort on each (SPEC-llm-player.md, "A shared
#             label is not a shared ceiling"), and some endpoints ignore it
#             entirely — the run prints a note when that happens.
#
# API keys are NOT set here — they live in .env (see .env.example).
players:
  - name: opus
    provider: anthropic
    model: claude-opus-4-8

  - name: gpt5
    provider: openai
    model: gpt-5.6-terra
    thinking: xhigh # this family's scale runs above where others top out

  # The same model at a second effort level is simply a second entry: standings
  # identify a player by name, so the two meet as separate players.
  - name: gpt5-medium
    provider: openai
    model: gpt-5.6-terra
    thinking: medium

  - name: gemini
    provider: gemini
    model: gemini-3.5-flash

  - name: kimi
    provider: openrouter
    model: moonshotai/kimi-k3

  - name: llama-local
    provider: my-ollama # a custom provider, defined in providers.yaml
    model: llama3.3
