[project]
name = "snakes-and-mice"
version = "1.2.0"
description = "Snakes and Mice — a game engine and pluggable players, used as an LLM reasoning benchmark"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "rdb64-hobbies", email = "bobby@blumofe.net" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "pydantic-ai>=2.26.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
]

[project.scripts]
play-match = "snakes_and_mice.match_cli:main"
play-tournament-matches = "snakes_and_mice.matches_cli:main"
tally-tournament = "snakes_and_mice.tally_cli:main"

[build-system]
requires = ["uv_build>=0.11.30,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "numpy>=2.1",
    "pytest>=9.1.1",
    "types-pyyaml>=6.0.12.20260724",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
