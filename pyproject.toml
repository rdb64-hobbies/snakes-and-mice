[project]
name = "snakes-and-mice"
version = "0.4.0"
description = "Snakes and Mice — a game engine and pluggable players, used as an LLM reasoning benchmark"
readme = "README.md"
authors = [
    { name = "rdb64-hobbies", email = "bobby@blumofe.net" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
snakes-and-mice = "snakes_and_mice.cli:main"

[build-system]
requires = ["uv_build>=0.11.30,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
